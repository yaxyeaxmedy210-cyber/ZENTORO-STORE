<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6fb;
}

header{
background:#fff;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.1);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:28px;
font-weight:bold;
color:#0057ff;
}

.logo span{
color:orange;
}

.icons{
display:flex;
gap:20px;
font-size:25px;
}

.banner{
margin:15px;
border-radius:20px;
overflow:hidden;
}

.banner img{
width:100%;
display:block;
border-radius:20px;
}

.section-title{
font-size:30px;
font-weight:bold;
margin:20px;
color:#003bff;
}

.games{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}.game-card{
background:#fff;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.08);
text-align:center;
padding-bottom:15px;
transition:.3s;
}

.game-card:hover{
transform:translateY(-5px);
}

.game-card img{
width:100%;
height:170px;
object-fit:cover;
}

.game-card h3{
padding:12px;
font-size:20px;
}

.open-btn{
display:inline-block;
background:#0066ff;
color:#fff;
padding:12px 30px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#fff;
display:flex;
justify-content:space-around;
padding:15px 0;
box-shadow:0 -3px 10px rgba(0,0,0,.1);
border-radius:20px 20px 0 0;
}

.bottom-nav a{
text-decoration:none;
color:#555;
font-size:14px;
font-weight:bold;
}

.bottom-nav a.active{
color:#0057ff;
}

.container{
padding-bottom:90px;
}

</style><body>
