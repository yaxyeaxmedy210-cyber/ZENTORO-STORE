<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTORO STORE</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
padding:20px;
}

h1{
color:#007bff;
}

.card{
background:white;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
box-shadow:0 0 10px rgba(0,0,0,.2);
}

select,input{
width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ccc;
}

button{
width:100%;
padding:12px;
margin-top:15px;
background:#007bff;
color:white;
border:none;
border-radius:8px;
font-size:18px;
}
</style>
</head>

<body>

<div class="card">
<h1>ZENTORO STORE</h1>

<p>Choose your game and submit your order.</p>

<select>
<option>eFootball</option>
<option>PUBG Mobile</option>
<option>Free Fire</option>
<option>Mobile Legends</option>
<option>Call of Duty Mobile</option>
</select>

<input type="text" placeholder="Enter Player ID">

<input type="text" placeholder="Enter your phone number">

<button>Submit Order</button>

</div>

</body>
</html>
